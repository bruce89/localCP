[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-cp"
version = "0.1.0"
description = "A local-first desktop application for exploring and understanding codebases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]

[project.gui-scripts]
local-cp = "local_cp.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_cp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

